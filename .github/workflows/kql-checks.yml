# Runs on every pull request into main.
#  Catalogue: the README query table and attack-coverage.json must be up to date.
#     If this fails, run:  python3 .github/scripts/kql_catalogue.py build  and commit.
name: KQL checks

on:
  pull_request:
    branches: [main]

# Read-only: this workflow never writes to the repo.
permissions:
  contents: read

jobs:
  kql-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check README catalogue and ATT&CK layer are up to date
        run: python3 .github/scripts/kql_catalogue.py build --check
